<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pad Numérico</title>

    <style>
        body {
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
        }

        .contenedor {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        .superiores {
            display: flex;
            gap: 10px;
        }

        .superiores button {
            width: 125px;
            height: 60px;
            font-size: 25px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background-color: #555;
            color: white;
            cursor: pointer;
        }

        .pad {
            display: grid;
            grid-template-columns: repeat(3, 80px);
            gap: 10px;
        }

        .pad button {
            width: 80px;
            height: 80px;
            font-size: 30px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background-color: #444;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background-color: #666;
        }

        button:active {
            background-color: #888;
            transform: scale(0.95);
        }
    </style>
</head>

<body>
    <div class="contenedor">

        <div class="superiores">
             <p><a href='/toggle'><button class='boton'>Display 1</button></a></p>
        </div>

        <div class="pad">
            <button onclick="presionar(1)">1</button>
            <button onclick="presionar(2)">2</button>
            <button onclick="presionar(3)">3</button>

            <button onclick="presionar(4)">4</button>
            <button onclick="presionar(5)">5</button>
            <button onclick="presionar(6)">6</button>

            <button onclick="presionar(7)">7</button>
            <button onclick="presionar(8)">8</button>
            <button onclick="presionar(9)">9</button>
        </div>

    </div>

</body>
</html>
